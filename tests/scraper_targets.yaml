# Fixed regression test targets for the live scraper battery (Phase 2 Task 2.4).
#
# Keys under gov_scrapers use each scraper's ACTUAL scraper_id (verified against
# the classes in intelligence/gov_scrapers/*.py and intelligence/exchange_scrapers/),
# not the plan's illustrative names - e.g. the forex scraper's id is "sbp_forex"
# (intelligence/exchange_scrapers/central_banks/sbp_pakistan.py), not "forex_rates",
# and PBS's id is "pbs_lsmi", not "pbs_stats". Using the real ids lets the test
# instantiate each scraper class directly by id without a lookup mismatch.

psx_tickers:
  banks:      [HBL, MCB, UBL, MEBL, BAHL]
  cement:     [LUCK, DGKC, MLCF, CHCC]
  fertilizer: [FFC, EFERT, ENGRO]
