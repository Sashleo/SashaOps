services:
  sashaops:
    build: .
    container_name: sashaops
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - sashaops_data:/app/data
      # .tmp is disposable scraper/OCR cache. It must be a Docker-managed volume:
      # the Windows bind mount is root-owned, so the non-root app user (uid 10001)
      # cannot write to it, which silently breaks every scraper cache.
      - sashaops_tmp:/app/.tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sashaops_data:
    name: sashaops_data
  sashaops_tmp:
    name: sashaops_tmp
